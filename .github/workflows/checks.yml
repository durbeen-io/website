# Automatic checks on every pull request (CLAUDE.md rule 11).
# The job name "Build and contrast" is what you select as a required check in GitHub.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved); the comment gives the version. Dependabot proposes updates.
# Every job has a timeout so a hung job cannot run for hours.

jobs:
  build:
    name: Build and contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Colour contrast (WCAG AA)
        run: npm run check:contrast
      - name: Pages CMS config matches the site's lists
        run: npm run check:cms
      - name: Build
        run: npm run build

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Sample drafts are included so the page has content to audit. The deploy and the link job build without them.
      - run: npm run build
        env:
          DURBEEN_INCLUDE_DRAFTS: '1'
      # Uses the Chrome already installed on the runner.
      - name: axe on every built page (light and dark, 375px)
        run: npm run check:axe

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Sample drafts are included so the page has content to audit. The deploy and the link job build without them.
      - run: npm run build
        env:
          DURBEEN_INCLUDE_DRAFTS: '1'
      # Budget and settings are in lighthouserc.json (median of 3 runs).
      - name: Lighthouse CI
        run: npm run check:lighthouse

  links:
    name: Internal links (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Sample drafts are included so the article, tag and series templates are link-checked too.
      - run: npm run build
        env:
          DURBEEN_INCLUDE_DRAFTS: '1'
      # Pinned to a full commit SHA (a tag can be moved). Version: v2.9.0
      - name: Check internal links in dist/
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist dist
          fail: true
