# Pages CMS configuration for durbeen.io: edit articles at https://app.pagescms.org (sign in with GitHub).
# GENERATED by `npm run cms:build` from src/lib/taxonomy.ts and src/content/tags.json. Do not edit by hand:
# `npm run check:cms` (and CI) fails if this file is out of date. How to use it: docs/CMS.md
media:
  - name: article_images
    label: Article images
    input: src/content/insights/images
    output: ./images
    extensions: [png, jpg, jpeg, webp]
    rename: safe
settings:
  content:
    merge: true # keep any frontmatter key this file does not list
content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/insights
    format: yaml-frontmatter
    subfolders: false
    exclude: ["_template-build-note.mdx", "_template-comparison.mdx", "_template-guide.mdx", "_template-infographic.mdx", "_template-review.mdx", "_template.mdx"]
    filename:
      template: "{primary}.mdx"
      field: create
    view:
      primary: title
      fields: [number, type, category, publishDate, draft]
      sort: [publishDate, number, title]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description (Google meta description)
        type: text
        required: true
        description: 120 to 160 characters. The build fails outside that range.
        options:
          minlength: 120
          maxlength: 160
      - name: number
        label: Log number
        type: number
        required: true
        description: The next free number. Each article needs its own (N°012). Drafts count too.
        options:
          min: 1
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: ["AI & AI Tools", "AI for Engineers", "GitHub & Open Source", "Building Durbeen"]
      - name: type
        label: Type
        type: select
        required: true
        description: An Infographic also needs the Text version (summary) below.
        options:
          values: ["Review", "Comparison", "Guide", "Experiment", "Build Note", "Insight", "Visual", "Infographic"]
      - name: level
        label: Level (hidden on the site; optional)
        type: select
        required: false
        options:
          values: ["Beginner", "Intermediate", "Advanced"]
      - name: tags
        label: Tags
        type: select
        required: true
        description: Choose 3 to 5 tags from the approved list.
        options:
          multiple: true
          min: 3
          max: 5
          values: ["ai-agents", "llm", "claude-code", "chatgpt", "gemini", "notebooklm", "prompting", "tokens-and-cost", "github", "git", "open-source", "repo-review", "security", "automation", "workflows", "productivity", "macos", "hazel", "markitdown", "markdown", "documents", "ocr", "typescript", "bash", "astro", "cloudflare", "tools", "building-in-public", "learning", "engineering", "inspection-qa", "standards"]
      - name: series
        label: Series (optional)
        type: select
        options:
          values: ["Building Durbeen in Public", "GitHub Mastery", "Repo Reviews"]
      - name: author
        label: Author
        type: string
        readonly: true
        default: Fahad Ehsan
      - name: publishDate
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: Updated date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: lastVerified
        label: Last verified (optional, for reviews)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: featured
        label: Feature on the home page
        type: boolean
        default: false
      - name: draft
        label: Draft (not published)
        type: boolean
        default: true
        description: Leave on while writing. Switch off to publish.
      - name: affiliate
        label: Contains affiliate links
        type: boolean
        default: false
      - name: heroImage
        label: Hero image (optional)
        type: image
        options:
          media: article_images
      - name: heroAlt
        label: Hero image alt text
        type: string
        description: Required if there is a hero image. One short sentence describing it.
      - name: ogImage
        label: Own social-preview image (optional)
        type: string
        description: Leave empty. A preview image is made automatically.
      - name: canonicalSource
        label: First published at (optional)
        type: string
        description: Only if the article appeared somewhere else first. A full https address.
      - name: summary
        label: Text version (required for Infographic)
        type: text
        description: For an Infographic, write the whole picture in plain sentences (200 characters or more). It is shown on the page.
      - name: scorecard
        label: Scorecard (Reviews only)
        type: object
        fields:
          - { name: setup, label: Setup (1 to 5), type: number, options: { min: 1, max: 5 } }
          - { name: docs, label: Docs (1 to 5), type: number, options: { min: 1, max: 5 } }
          - { name: maintenance, label: Maintenance (1 to 5), type: number, options: { min: 1, max: 5 } }
          - { name: safety, label: Safety (1 to 5), type: number, options: { min: 1, max: 5 } }
          - { name: verdict, label: Verdict (one sentence), type: string }
      - name: body
        label: Article text (MDX)
        type: code
        options:
          format: mdx
