      - name: new-review
        label: New Review
        type: collection
        path: src/content/insights
        format: yaml-frontmatter
        subfolders: false
        exclude: ["_template-build-note.mdx", "_template-comparison.mdx", "_template-guide.mdx", "_template-infographic.mdx", "_template-review.mdx", "_template.mdx"]
        filename:
          template: "{primary}.mdx"
          field: create
        view:
          primary: title
          fields: [number, type, category, publishDate, draft]
          sort: [publishDate, number, title]
          search: [title, type]
          default:
            search: "Review"
            sort: publishDate
            order: desc
        fields:
          - name: title
            default: "[FILL] Review: tool or repo name, and the verdict in a few words"
            label: Title
            type: string
            required: true
          - name: description
            default: "[FILL] One sentence of 120 to 160 characters that tells a reader what they will learn or decide, and why it is worth their time."
            label: Description (Google meta description)
            type: text
            required: true
            description: 120 to 160 characters. The build fails outside that range.
            options:
              minlength: 120
              maxlength: 160
          - name: number
            label: Log number
            type: number
            required: true
            description: The next free number. Each article needs its own (N°012). Drafts count too.
            options:
              min: 1
          - name: category
            default: "AI & AI Tools"
