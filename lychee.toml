# Link check for the built site (run by the "Links" job in .github/workflows/checks.yml).
# Offline mode: checks internal links in dist/ only. External links are not checked.
#
# RULE: when a page below ships, DELETE its entry here. Do not leave stale entries.
# Zero entries left is a Phase 5 gate (CLAUDE.md section 12).

offline = true
# root_dir must be absolute, so it is passed in the workflow (--root-dir).
# Anchor (#fragment) checking is off: lychee 0.24 cannot resolve fragments on directory-style links
# like /design-system/components/#button, even though the ids exist (false alarms).
no_progress = true

exclude = [
  # Phase 5 (remaining pages)
  'file://.*/resources/?$',
  'file://.*/toolkit/?$',
  'file://.*/about/?$',
  'file://.*/editorial-policy/?$',
  'file://.*/privacy/?$',
  'file://.*/terms/?$',
  'file://.*/affiliate-disclosure/?$',
]
